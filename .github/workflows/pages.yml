name: Deploy built website
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check publication contains output only
        shell: bash
        run: |
          test -f index.html
          test ! -d src
          test ! -f package.json
          test -z "$(find assets -name '*.map' -print -quit)"
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .
          include-hidden-files: true
      - name: Deploy
        id: deployment
        # Use the REST artifact lookup; the current artifact-service lookup returns empty.
        uses: actions/deploy-pages@f33f41b675f0ab2dc5a6863c9a170fe83af3571e # v4.0.0
